name: Feature request
description: Something tern should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What you would type or click, and what you would expect to happen.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What goes wrong today, or what takes too long.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
