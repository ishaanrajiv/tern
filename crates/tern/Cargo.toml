[package]
name = "tern"
version = "0.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "tern"
path = "src/bin/tern.rs"

[[bin]]
name = "ternd"
path = "src/bin/ternd/main.rs"

[dependencies]
anyhow = "1"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "ioctl", "poll", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
